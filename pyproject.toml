[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "security-gate"
version = "0.2.0"
description = "AI-native commit security gate: scans each push/PR for secrets, risky code, fake packages, vulnerable dependencies and infra misconfigurations."
readme = "README.md"
requires-python = ">=3.11"
# Pinned exactly (supply chain). Scanners (gitleaks, semgrep, checkov) are installed separately.
dependencies = [
    "openai==3.19.2",  # Stations 9/10: AI Hunter + Verifier (client's own API key)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
security-gate = "security_gate.cli:main"

[tool.setuptools.packages.find]
include = ["security_gate*"]

[tool.setuptools.package-data]
security_gate = ["rules/*.yml"]  # ship the AI-smell rule pack inside the package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
