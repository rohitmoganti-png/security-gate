# AI code-smell rule pack (ticket ENG-382).
# Mistakes AI coding assistants repeatedly make. Each one is a real risk AND a weak hint
# that generated code went in unreviewed. Loaded in the SAME Semgrep run as the main ruleset;
# `metadata.source: ai-smell-pack` lets the gate report these separately.
#
# Severity: ERROR = high (blocks when new), WARNING = medium (warns only).

rules:
  # 1. Placeholder credentials left in code
  - id: ai-smell.placeholder-credential
    languages: [generic]
    severity: WARNING
    message: A placeholder credential was left in code. Load real secrets from the environment or a secrets manager.
    pattern-regex: (?i)\b(api[_-]?key|secret|password|passwd|token|auth)\w*\s*[:=]\s*["'](your[-_ ]?[a-z_ -]*(key|secret|token|password)[a-z_ -]*|change[-_ ]?me|placeholder|replace[-_ ]?me|xxx+|sk-\.\.\.|sk-x+|<[a-z_ -]+>|dummy[-_ ]?(key|secret|token))["']
    paths:
      exclude: ["*.md", "*.txt", "*.example", "*.sample"]
    metadata: {source: ai-smell-pack, category: placeholder-credentials}

  # 2. TLS certificate verification disabled
  - id: ai-smell.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification is disabled, so traffic can be intercepted (man-in-the-middle).
    pattern-either:
      - pattern: $FUNC(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
    metadata: {source: ai-smell-pack, category: tls-disabled, cwe: "CWE-295"}
  - id: ai-smell.tls-verification-disabled-js
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled, so traffic can be intercepted (man-in-the-middle).
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata: {source: ai-smell-pack, category: tls-disabled, cwe: "CWE-295"}

  # 3. SQL built by string concatenation / f-strings instead of parameters
  - id: ai-smell.sql-string-building
    languages: [python]
    severity: ERROR
    message: SQL is built from strings. Use parameterized queries (e.g. execute("... WHERE id = ?", (id,))).
    pattern-either:
      - pattern: $DB.execute(f"...", ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.execute("..." % $X, ...)
      - pattern: $DB.execute("...".format(...), ...)
    metadata: {source: ai-smell-pack, category: sql-string-building, cwe: "CWE-89"}
  - id: ai-smell.sql-string-building-js
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL is built from strings. Use parameterized queries (placeholders + values array).
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X, ...)
    metadata: {source: ai-smell-pack, category: sql-string-building, cwe: "CWE-89"}

  # 4. Shell execution with shell=True / exec of a built string
  - id: ai-smell.shell-true
    languages: [python]
    severity: ERROR
    message: Command runs through a shell. Pass a list of arguments and drop shell=True.
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
    metadata: {source: ai-smell-pack, category: shell-injection, cwe: "CWE-78"}
  - id: ai-smell.shell-exec-js
    languages: [javascript, typescript]
    severity: ERROR
    message: Command runs through a shell with a built string. Use execFile/spawn with an argument array.
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)
    metadata: {source: ai-smell-pack, category: shell-injection, cwe: "CWE-78"}

  # 5. Silent failure: bare except / empty catch
  - id: ai-smell.silent-exception
    languages: [python]
    severity: WARNING
    message: Errors are silently swallowed. At least log them, and catch specific exceptions.
    pattern-either:
      - pattern: |
          try:
              ...
          except:
              pass
      - pattern: |
          try:
              ...
          except Exception:
              pass
    metadata: {source: ai-smell-pack, category: silent-failure}
  - id: ai-smell.silent-exception-js
    languages: [javascript, typescript]
    severity: WARNING
    message: Errors are silently swallowed by an empty catch block.
    pattern: |
      try { ... } catch ($E) {}
    metadata: {source: ai-smell-pack, category: silent-failure}

  # 6. CORS open to every origin
  - id: ai-smell.cors-wildcard
    languages: [python]
    severity: WARNING
    message: CORS allows any origin ("*"). List the specific origins that need access.
    pattern-either:
      - pattern: CORS(..., origins="*", ...)
      - pattern: 'CORS(..., resources={..., $PATH: {..., "origins": "*", ...}, ...}, ...)'
      - pattern: $R.headers["Access-Control-Allow-Origin"] = "*"
    metadata: {source: ai-smell-pack, category: cors-wildcard, cwe: "CWE-942"}
  - id: ai-smell.cors-wildcard-js
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows any origin. Configure an explicit origin allow-list.
    pattern-either:
      - pattern: cors()
      - pattern: 'cors({..., origin: "*", ...})'
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", "*")
    metadata: {source: ai-smell-pack, category: cors-wildcard, cwe: "CWE-942"}

  # 7. Debug mode left on
  - id: ai-smell.debug-enabled
    languages: [python]
    severity: WARNING
    message: Debug mode is on. It exposes stack traces and (in Flask) an interactive debugger.
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: DEBUG = True
    metadata: {source: ai-smell-pack, category: debug-enabled, cwe: "CWE-489"}

  # 8. JWT decoded without verifying the signature
  - id: ai-smell.jwt-signature-not-verified
    languages: [python]
    severity: ERROR
    message: JWT is decoded without checking its signature, so anyone can forge a token.
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)
    metadata: {source: ai-smell-pack, category: jwt-no-verify, cwe: "CWE-347"}
  - id: ai-smell.jwt-signature-not-verified-js
    languages: [javascript, typescript]
    severity: ERROR
    message: jwt.decode() does NOT verify the signature. Use jwt.verify() with a secret/key.
    pattern: jwt.decode(...)
    metadata: {source: ai-smell-pack, category: jwt-no-verify, cwe: "CWE-347"}

  # 9. Leftover AI scaffolding phrases ("in a real implementation...")
  - id: ai-smell.unfinished-scaffolding
    languages: [generic]
    severity: WARNING
    message: Leftover placeholder text. This code looks unfinished; check the logic it describes actually exists.
    pattern-regex: (?i)(in a real (implementation|application|app|system|world)|in production,? you (would|should)|TODO:?\s*(add|implement)\s+(actual|real|proper)?\s*(input\s+)?(validation|auth\w*|security|permission|error handling)|for (demo|demonstration|example) purposes only|placeholder (implementation|logic)|replace (this )?with (your|actual|real) (logic|implementation|validation|key))
    paths:
      exclude: ["*.md", "*.txt"]
    metadata: {source: ai-smell-pack, category: unfinished-scaffolding}
